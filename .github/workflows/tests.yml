name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one red job must not hide what the others found
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest  # the platform it is played on (Segoe UI / Consolas)
            python-version: "3.14"
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python tools/selfcheck.py --quick
